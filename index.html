<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>

  <body>
    <main class="container">
      <div class="calculator dark">
        <!-- Theme toggle -->
        <div
          class="theme-toggler active"
          role="button"
          tabindex="0"
          aria-label="Toggle light and dark theme"
        >
          <i class="toggler-icon"></i>
        </div>

        <!-- Display -->
        <div class="display-screen">
          <div id="display" aria-live="polite"></div>
        </div>

        <!-- Keypad -->
        <div class="button">
          <table>
            <tr>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="clear"
                  aria-label="Clear"
                >
                  C
                </button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="/"
                  aria-label="Divide"
                >
                  &divide;
                </button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="*"
                  aria-label="Multiply"
                >
                  &times;
                </button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="backspace"
                  aria-label="Backspace"
                >
                  &#9003;
                </button>
              </td>
            </tr>

            <tr>
              <td>
                <button type="button" class="btn-number" id="7">7</button>
              </td>
              <td>
                <button type="button" class="btn-number" id="8">8</button>
              </td>
              <td>
                <button type="button" class="btn-number" id="9">9</button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="-"
                  aria-label="Subtract"
                >
                  -
                </button>
              </td>
            </tr>

            <tr>
              <td>
                <button type="button" class="btn-number" id="4">4</button>
              </td>
              <td>
                <button type="button" class="btn-number" id="5">5</button>
              </td>
              <td>
                <button type="button" class="btn-number" id="6">6</button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="+"
                  aria-label="Add"
                >
                  +
                </button>
              </td>
            </tr>

            <tr>
              <td>
                <button type="button" class="btn-number" id="1">1</button>
              </td>
              <td>
                <button type="button" class="btn-number" id="2">2</button>
              </td>
              <td>
                <button type="button" class="btn-number" id="3">3</button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-number"
                  id="."
                  aria-label="Decimal point"
                >
                  .
                </button>
              </td>
            </tr>

            <tr>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id="("
                  aria-label="Open bracket"
                >
                  (
                </button>
              </td>
              <td>
                <button type="button" class="btn-number" id="0">0</button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-operator"
                  id=")"
                  aria-label="Close bracket"
                >
                  )
                </button>
              </td>
              <td>
                <button
                  type="button"
                  class="btn-equal"
                  id="equal"
                  aria-label="Equals"
                >
                  =
                </button>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </main>

    <script src="calculator.js"></script>
  </body>
</html>
